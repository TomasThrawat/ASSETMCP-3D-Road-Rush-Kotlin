name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Lint
        run: gradle :app:lintDebug --stacktrace --warning-mode=all

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode=all

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ASSETMCP-3D-Road-Rush-debug
          path: app/build/outputs/apk/debug/app-debug.apk
