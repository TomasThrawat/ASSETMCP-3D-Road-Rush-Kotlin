name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify preinstalled Android 17 SDK
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -n "$SDK_ROOT"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -f "$SDK_ROOT/platforms/android-37/android.jar"
          echo "Using Android SDK platform: $SDK_ROOT/platforms/android-37"
          ls -ld "$SDK_ROOT/platforms/android-37"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Lint
        run: gradle :app:lintDebug --stacktrace --warning-mode=all

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode=all

      - name: Verify APK
        shell: bash
        run: |
          set -eu
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ASSETMCP-3D-Road-Rush-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
