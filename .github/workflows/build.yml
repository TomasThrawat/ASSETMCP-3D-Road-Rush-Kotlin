name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show Android SDK environment
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "ANDROID SDK: $SDK_ROOT"
          find "$SDK_ROOT/platforms" -maxdepth 1 -type d -name 'android-37*' -print | sort -V
          find "$SDK_ROOT/build-tools" -maxdepth 1 -type d \( -name '37.*' -o -name '36.*' \) -print | sort -V

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Verify Gradle
        run: gradle --version

      - name: Lint
        run: gradle :app:lintDebug --stacktrace --warning-mode=all

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode=all

      - name: Verify APK
        shell: bash
        run: |
          set -eu
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ASSETMCP-3D-Road-Rush-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
